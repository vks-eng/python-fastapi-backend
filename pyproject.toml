[project]
name = "taskforge-api"
version = "1.0.0"
description = "TaskForge API: Production-Ready FastAPI Task Management Backend (FastAPI, async SQLAlchemy 2.0, PostgreSQL, JWT)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    # Contract testing: property-based fuzzing of the OpenAPI schema (tests/contract).
    "schemathesis>=4.33,<5",
    "hypothesis>=6.170",
    # Embedded PostgreSQL binaries used ONLY for local test runs when
    # TEST_DATABASE_URL is not set. Never imported by application code.
    "pgserver>=0.1.4; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64'",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "TID",
]
ignore = [
    "B008", # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Volume/perf-style tests are opt-in: `pytest -m slow`.
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
    "unit: pure logic, no database or network (tests/unit)",
    "integration: API + real PostgreSQL through the ASGI app (tests/integration)",
    "e2e: multi-step user journeys through the full app (tests/e2e)",
    "contract: OpenAPI snapshot + Schemathesis fuzzing (tests/contract)",
    "smoke: critical-path subset, run first / after deploys",
    "security: authN/authZ, tampering, injection, rate limiting, data exposure",
    "slow: long-running volume tests, excluded by default (run with -m slow)",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio layer runs DB calls in greenlets; trace them too.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
